# Default setup: the app and its own PostgreSQL in one stack.
# If you already run PostgreSQL in another container, use compose.external-db.yml instead.
services:
  web:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Passed as separate variables (not a URL) so any characters are allowed in the password.
      DATABASE_URL: ""
      PGHOST: db
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-university_apply}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGDATABASE: ${POSTGRES_DB:-university_apply}
    ports:
      # Only reachable from the host itself; expose publicly through Nginx + HTTPS.
      - "127.0.0.1:${APP_PORT:-3010}:3000"
    volumes:
      - ./data/uploads:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-university_apply}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-university_apply}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
