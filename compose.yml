services:
  web:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      UPLOAD_DIR: /app/data/uploads
    ports:
      - "127.0.0.1:3010:3000"
    volumes:
      - ./data/uploads:/app/data/uploads
    networks:
      - database

networks:
  database:
    external: true
    name: ${POSTGRES_DOCKER_NETWORK:?Set POSTGRES_DOCKER_NETWORK in .env to the network used by PostgreSQL}
