# /etc/nginx/sites-available/qabuluz  — replace example.uz with your domain.
# Then: ln -s /etc/nginx/sites-available/qabuluz /etc/nginx/sites-enabled/
#       nginx -t && systemctl reload nginx
#       certbot --nginx -d example.uz -d www.example.uz
server {
    listen 80;
    listen [::]:80;
    server_name example.uz www.example.uz;

    # Up to 4 documents x 20 MB per application (Nginx default is only 1 MB).
    client_max_body_size 100m;
    client_body_timeout 120s;

    # OCR engine/model files under /ocr are several MB; compress them on the fly.
    gzip on;
    gzip_types application/javascript text/javascript application/octet-stream application/wasm text/plain text/css application/json image/svg+xml;
    gzip_min_length 1024;

    # Cross-origin isolation: lets the in-browser OCR use several CPU threads (also sent by the app).
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_request_buffering on;
    }
}
