# /etc/nginx/sites-available/qabuluz  — replace example.uz with your domain.
# Then: ln -s /etc/nginx/sites-available/qabuluz /etc/nginx/sites-enabled/
#       nginx -t && systemctl reload nginx
#       certbot --nginx -d example.uz -d www.example.uz
server {
    listen 80;
    listen [::]:80;
    server_name example.uz www.example.uz;

    # Up to 4 documents x 20 MB per application (Nginx default is only 1 MB).
    client_max_body_size 100m;
    client_body_timeout 120s;

    # OCR engine/model files under /ocr are several MB; compress them on the fly.
    gzip on;
    gzip_types application/javascript text/javascript application/octet-stream application/wasm text/plain text/css application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 6;

    # Cross-origin isolation (COOP/COEP, needed for multi-threaded OCR) is sent by the app itself
    # (next.config.ts). Do NOT add it here as well: a duplicated COEP header is invalid and turns
    # isolation off.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # OCR models / WASM (~7 MB) are in a versioned folder (lib/ocr/assets.json): cache for a year.
    # (add_header inside a location replaces the server-level ones, so nosniff is repeated.)
    location /ocr/ {
        proxy_pass http://127.0.0.1:3010;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_request_buffering on;
    }
}
